services:
  # [NEW] Tambahkan Service Redis
  keuanganku-redis:
    image: redis:alpine
    container_name: keuanganku-redis
    restart: always
    networks:
      - e-daily-report-net
    # Opsional: Jika ingin data Redis tidak hilang saat server restart
    volumes:
      - redis_data:/data

  keuanganku-be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keuanganku-be
    restart: always
    env_file: .env
    depends_on:
      - keuanganku-redis # Pastikan Redis menyala lebih dulu
    ports:
      - "3001:4000"  
      - "5555:5555"  
    volumes:
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G  
        reservations:
          memory: 256M
    networks:
      - e-daily-report-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  e-daily-report-net:
    external: true
    name: e-daily-report_default

# [NEW] Daftarkan volume untuk Redis
volumes:
  redis_data:
